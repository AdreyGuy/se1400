<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Andrew's Tech Art Portfolio - Menu Grid Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <!-- Row 1: Navigation Section (Columns 2 to 7) -->
        <header class="nav-section">
            <div class="logo-rect"></div>
            <div class="burger-rect"></div>
        </header>

        <!-- Row 2: Top Gap (Columns 2 to 7) -->
        <div class="top-gap"></div>

        <!-- Row 3: Left Gap (Column 1) -->
        <div class="left-gap"></div>

        <!-- Row 3: Main Section (Columns 2 to 4) -->
        <main class="main-section">
            <div class="button-rect btn-main-page"></div>
            <div class="button-rect btn-about-me"></div>
            <div class="button-rect btn-all-artworks"></div>
        </main>

        <!-- Row 3: Middle Gap (Column 5) -->
        <div class="middle-gap"></div>

        <!-- Row 3: Contact Info (Columns 6 to 7) -->
        <section class="contact-info">
            <div class="contact-rect email-rect"></div>
            <div class="contact-rect phone-rect"></div>
            <div class="circles-row">
                <span class="dot-rect"></span>
                <span class="dot-rect"></span>
                <span class="dot-rect"></span>
            </div>
        </section>

        <!-- Row 3: Right Gap (Column 8) -->
        <div class="right-gap"></div>

        <!-- Row 4: Footer Section (Columns 2 to 7) -->
        <footer class="footer-section">
            <div class="footer-rect"></div>
        </footer>
    </div>
</body>
</html>
